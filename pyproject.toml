[project]
name = "expenseshistory"
version = "0.1.0"
description = "Desktop expense and income tracker (PyQt6 + SQLite)"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "anthropic>=2.8.0",
    "google-genai>=3.3.0",
    "pyqt6>=6.11.0",
    "pyqtgraph>=0.14.0",
    "sqlalchemy>=2.0.52",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.2",
    "pytest>=8.0.0",
]

[tool.uv]
package = false
default-groups = "all"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# google-genai's own docstrings
filterwarnings = ["ignore:.*invalid escape sequence:SyntaxWarning"]
